<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>look club</title>
  <meta name="description" content="one prompt a week. everyone goes looking. one shared gallery.">
  <meta name="theme-color" content="#0b1427">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/moto.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="page">
    <header class="top">
      <a class="logo" href="/" id="logo"><span class="spark">✦</span>look club</a>
      <div class="top-right" id="topRight"></div>
    </header>
    <div class="menu" id="menu"></div>
    <main id="app"><p class="empty-note" style="padding-top:20vh;text-align:center">looking up…</p></main>
  </div>
  <footer class="foot">one prompt · everyone’s eyes · the same sky</footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="stage"><img alt=""></div>
    <div class="info"><div class="who"></div><div class="cap"></div></div>
    <button class="lb-btn lb-close" aria-label="close" data-cursor="close">✕</button>
    <button class="lb-btn lb-prev" aria-label="previous" data-cursor="previous">←</button>
    <button class="lb-btn lb-next" aria-label="next" data-cursor="next">→</button>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
